[package]
name = "hwpx"
version = "1.0.0"
edition = "2021"
description = "Compile and parse Hancom HWPX documents"
build = "build.rs"

[lib]
name = "hwpx"
path = "src/lib.rs"

[[bin]]
name = "md2hwpx"
path = "src/bin/md2hwpx.rs"

[[bin]]
name = "hwpx2md"
path = "src/bin/hwpx2md.rs"

[workspace]
members = [".", "web/wasm"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
regex = { package = "regex-lite", version = "0.1" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
regex = "1"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winresource = "0.1"
