[package]
name = "hwpx-wasm"
version = "1.0.0"
edition = "2021"
description = "Wasm bindings for the md2hwpx compiler and hwpx2md converter"

[lib]
name = "hwpx_wasm"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hwpx = { path = "../.." }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
